# Публикация библиотеки в Package Registry этого проекта.
# Тег vX.Y.Z публикует версию библиотеки из каталога, номер в теге должен с ней совпадать.
# Раннер на Linux: ifBuildIos не включает iOS, в реестр уходит только Android и common.

publish:
  tags:
    - android-deploy
  image:
    name: registry.izibook.ru/android/ci-cd/builder:37-jdk21
    pull_policy: if-not-present
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    GRADLE_USER_HOME: /gradle-home
  cache:
    key: $CI_PROJECT_NAME-gradle
    when: always
    paths:
      - .gradle/
  script:
    # Версия библиотеки приходит из каталога, поэтому спрашиваем её у Gradle
    - |
      version=$(./gradlew -q :jobs-core:properties --no-daemon | sed -n 's/^version: //p')
    - test "v$version" = "$CI_COMMIT_TAG"
    - ./gradlew :jobs-core:publishAllPublicationsToGitLabRepository --no-daemon
